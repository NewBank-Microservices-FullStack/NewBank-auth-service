server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/authdb
spring.datasource.username=admin
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret-key=local-dev-secret-key-minimum-32-characters-long
jwt.refresh-key=local-dev-refresh-key-minimum-32-characters-long

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

allowed.origins=http://localhost:5173,http://localhost:3000

# Run with: -Dspring.profiles.active=local
# Or set env var: SPRING_PROFILES_ACTIVE=local
# Local PostgreSQL — run via Docker:
# docker run -e POSTGRES_DB=authdb -e POSTGRES_USER=admin -e POSTGRES_PASSWORD=secret -p 5433:5432 postgres:16

# --- Local demo data seeding ---
newbank.seed.enabled=true
newbank.seed.demo-user.username=testuser
newbank.seed.demo-user.password=${NEWBANK_SEED_PASSWORD:password123}
newbank.seed.demo-user.fullname=Test User
newbank.seed.demo-user.email=test@example.com
newbank.seed.demo-user.roles=ROLE_USER
